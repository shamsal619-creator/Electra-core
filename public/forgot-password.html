<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - ElectraCore</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css?v=20260605">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            background: var(--light);
            font-family: 'Inter', sans-serif;
        }
        .card {
            display: flex;
            max-width: 1100px;
            width: 100%;
            background: white;
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(0,0,0,0.08);
        }
        .left {
            flex: 0 0 42%;
            background: var(--signup-left-bg);
            color: var(--signup-left-text);
            padding: 60px 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            text-align: center;
            align-items: center;
        }
        .logo-mark {
            display: inline-flex;
            align-items: center;
            margin-bottom: 20px;
        }
        .logo-mark img {
            height: 140px;
            width: auto;
            filter: drop-shadow(0 4px 10px rgba(0,0,0,0.1));
        }
        .left h1 {
            font-size: 36px;
            font-weight: 800;
            margin-bottom: 10px;
        }
        .left .divider {
            width: 50px;
            height: 4px;
            background: rgba(255,255,255,0.3);
            margin: 24px 0;
            border-radius: 4px;
        }
        .left p {
            line-height: 1.8;
            opacity: 0.95;
            font-weight: 500;
            font-size: 17px;
            letter-spacing: 0.2px;
        }
        .left .cta {
            display: inline-block;
            margin-top: 40px;
            padding: 14px 32px;
            border-radius: 12px;
            border: 2px solid rgba(255,255,255,0.4);
            color: white;
            text-decoration: none;
            font-weight: 700;
            transition: all 0.3s ease;
        }
        .left .cta:hover {
            background: rgba(255,255,255,0.15);
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .right {
            flex: 1;
            padding: 60px 64px;
            background: #ffffff;
        }
        .right h2 {
            margin-top: 0;
            margin-bottom: 32px;
            font-size: 32px;
            font-weight: 800;
            color: var(--signup-heading);
        }
        .right p.description {
            color: var(--muted);
            margin-bottom: 32px;
            line-height: 1.8;
        }
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 24px;
        }
        .form-group label {
            font-size: 14px;
            font-weight: 600;
            color: var(--signup-form-label);
            margin-left: 2px;
        }
        input[type="email"] {
            height: 52px;
            padding: 12px 18px;
            border: 1px solid var(--form-input-border);
            border-radius: 10px;
            font-size: 15px;
            font-family: inherit;
            transition: all 0.3s ease;
            background: var(--form-input-bg);
        }
        input:focus {
            outline: none;
            border-color: var(--teal);
            background: #fff;
            box-shadow: 0 0 0 4px rgba(5, 163, 145, 0.1);
        }
        .btn {
            width: 100%;
            height: 52px;
            background: var(--signup-button-bg);
            color: var(--btn-text-color);
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
        }
        .btn:hover {
            background: var(--signup-button-hover-bg);
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(5, 163, 145, 0.2);
        }
        .message {
            margin-top: 20px;
            font-size: 15px;
            line-height: 1.7;
        }
        .message.error {
            color: #dc2626;
        }
        .message.success {
            color: #10b981;
        }
        .muted {
            color: var(--muted);
            text-align: center;
            margin-top: 24px;
            font-size: 14px;
        }
        .muted a {
            color: var(--teal);
            text-decoration: none;
            font-weight: 700;
        }
        @media (max-width: 992px) {
            .card {
                flex-direction: column;
                max-width: 550px;
            }
            .left {
                flex: none;
                padding: 50px 30px;
            }
            .right {
                padding: 50px 40px;
            }
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="left">
            <a href="index.html" class="logo-mark">
                <img src="design/logo.png" alt="ElectraCore logo">
            </a>
            <div class="divider"></div>
            <p>Enter your email address and<br>we'll send you a reset link</p>
            <a href="signin.html" class="cta">Sign in</a>
        </div>
        <div class="right">
            <h2>Forgot Password</h2>
            <p class="description">Enter your email address and we will send you a secure reset link so you can choose a new password.</p>
            <form id="forgotForm">
                <div class="form-group">
                    <label for="forgotEmail">Email Address</label>
                    <input type="email" id="forgotEmail" placeholder="your@email.com" required>
                </div>
                <button type="submit" class="btn">Send reset link</button>
                <div id="forgotMessage" class="message"></div>
            </form>
            <p class="muted">Remembered password? <a href="signin.html">Sign in</a></p>
        </div>
    </div>

    <script>
        document.getElementById('forgotForm').addEventListener('submit', async (event) => {
            event.preventDefault();
            const email = document.getElementById('forgotEmail').value.trim();
            const message = document.getElementById('forgotMessage');
            message.textContent = '';
            message.className = 'message';

            try {
                const response = await fetch('/api/forgot-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });
                const data = await response.json();
                if (!response.ok) {
                    message.textContent = data.error || 'Unable to send reset link.';
                    message.classList.add('error');
                    return;
                }
                message.textContent = data.message || 'A reset link has been sent if the email exists.';
                message.classList.add('success');
                if (data.debugLink) {
                    const debugLink = document.createElement('div');
                    debugLink.style.marginTop = '12px';
                    debugLink.style.fontSize = '12px';
                    debugLink.innerHTML = `Debug: <a href="${data.debugLink}" target="_blank">${data.debugLink}</a>`;
                    message.appendChild(debugLink);
                }
            } catch (err) {
                message.textContent = 'Server error. Please try again later.';
                message.classList.add('error');
            }
        });
    </script>
</body>
</html>
