<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - ElectraCore</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; padding: 0; font-family: 'Inter', sans-serif; background: #f5f5f5; }
        .admin-container { display: flex; min-height: 100vh; }
        .admin-sidebar {
            background: rgba(30, 30, 30, 0.55);
            backdrop-filter: blur(18px) saturate(1.4);
            -webkit-backdrop-filter: blur(18px) saturate(1.4);
            border-right: 1px solid rgba(255, 255, 255, 0.12);
            color: white;
            padding: 20px;
            width: 220px;
            box-shadow: 4px 0 24px rgba(0,0,0,0.25);
            position: fixed;
            left: 0;
            top: 0;
            height: 100vh;
            overflow-y: auto;
            z-index: 100;
            transition: transform 0.35s cubic-bezier(.4,0,.2,1), width 0.35s cubic-bezier(.4,0,.2,1);
        }
        .admin-sidebar.collapsed {
            transform: translateX(-100%);
        }
        .sidebar-toggle {
            position: fixed;
            top: 50%;
            left: 220px;
            transform: translateY(-50%);
            width: 28px;
            height: 56px;
            background: rgba(30, 30, 30, 0.55);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-left: none;
            border-radius: 0 10px 10px 0;
            color: white;
            font-size: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 101;
            transition: left 0.35s cubic-bezier(.4,0,.2,1), background 0.2s;
            padding: 0;
        }
        .sidebar-toggle:hover {
            background: rgba(5, 163, 145, 0.45);
        }
        .sidebar-toggle.collapsed {
            left: 0;
        }
        .sidebar-toggle .arrow {
            display: inline-block;
            transition: transform 0.35s;
        }
        .sidebar-toggle.collapsed .arrow {
            transform: rotate(180deg);
        }
        .admin-main {
            transition: margin-left 0.35s cubic-bezier(.4,0,.2,1);
        }
        .admin-main.sidebar-hidden {
            margin-left: 0;
        }
        .admin-sidebar h2 { font-size: 14px; font-weight: 900; margin: 0 0 20px 0; color: var(--teal); text-transform: uppercase; }
        .admin-logo {
            display: block;
            text-align: center;
            margin-bottom: 20px;
        }
        .admin-logo img {
            height: 80px;
            width: auto;
        }
        .sidebar-nav { display: flex; flex-direction: column; gap: 8px; }
        .nav-item {
            padding: 12px 15px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 700;
            transition: all 0.3s;
            border-left: 3px solid transparent;
        }
        .nav-item:hover { background: rgba(5, 163, 145, 0.2); border-left-color: var(--teal); }
        .nav-item.active { background: rgba(5, 163, 145, 0.3); border-left-color: var(--teal); color: var(--teal); }
        .admin-main {
            margin-left: 220px;
            padding: 30px;
            flex: 1;
            overflow-y: auto;
        }
        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 15px;
            border-bottom: 2px solid var(--border);
        }
        .admin-header h1 { font-size: 28px; font-weight: 900; margin: 0; color: var(--dark); }
        .user-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .user-email { font-size: 12px; color: var(--muted); font-weight: 700; }
        .btn-logout {
            padding: 10px 20px;
            background: #dc2626;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
        }
        .btn-logout:hover { background: #991b1b; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .section {
            background: white;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            margin-bottom: 20px;
        }
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 2px solid var(--teal);
        }
        .section-header h2 { font-size: 18px; font-weight: 900; margin: 0; color: var(--dark); }
        .btn-primary {
            padding: 10px 20px;
            background: var(--teal);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 700;
            font-size: 12px;
            cursor: pointer;
            transition: 0.3s;
        }
        .btn-primary:hover { opacity: 0.9; }
        .form-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 15px; }
        .form-group { display: flex; flex-direction: column; gap: 4px; }
        .form-group.full-width { grid-column: span 2; }
        label { font-size: 12px; font-weight: 700; color: var(--dark); }
        input, select, textarea {
            padding: 10px 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-family: inherit;
            font-size: 12px;
            outline: none;
            transition: 0.2s;
        }
        input:focus, select:focus, textarea:focus {
            border-color: var(--teal);
            box-shadow: 0 0 0 2px rgba(5, 163, 145, 0.1);
        }
        input:disabled, textarea:disabled { background: #f5f5f5; }
        .btn-actions { display: flex; gap: 8px; margin-top: 12px; }
        .btn-secondary {
            padding: 10px 20px;
            background: #e5e7eb;
            color: var(--dark);
            border: none;
            border-radius: 8px;
            font-weight: 700;
            font-size: 12px;
            cursor: pointer;
            flex: 1;
        }
        .btn-secondary:hover { background: #d1d5db; }
        .products-table { width: 100%; border-collapse: collapse; }
        .products-table th, .products-table td { padding: 10px; text-align: left; font-size: 12px; border-bottom: 1px solid var(--border); }
        .products-table th { background: #f9f9f9; font-weight: 700; }
        .product-thumbnail {
            width: 50px;
            height: 50px;
            object-fit: cover;
            border-radius: 6px;
            border: 1px solid var(--border);
        }
        .product-name-cell {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .btn-edit, .btn-delete {
            padding: 5px 10px;
            border: none;
            border-radius: 5px;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
            margin-right: 8px;
        }
        .btn-edit { background: #3b82f6; color: white; }
        .btn-edit:hover { background: #1d4ed8; }
        .btn-delete { background: #ef4444; color: white; }
        .btn-delete:hover { background: #dc2626; }
        .search-bar {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        .search-input { flex: 1; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 12px; }
        .btn-search {
            padding: 10px 20px;
            background: var(--teal);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 700;
            font-size: 12px;
            cursor: pointer;
        }
        .btn-search:hover { opacity: 0.9; }
        .btn-reset {
            padding: 10px 20px;
            background: #9ca3af;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 700;
            font-size: 12px;
            cursor: pointer;
        }
        .orders-grid { display: grid; gap: 15px; }
        .order-card {
            background: white;
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 16px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.08);
        }
        .order-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border);
        }
        .order-id { font-size: 13px; font-weight: 900; color: var(--dark); }
        .order-code {
            background: #f0fdf4;
            padding: 4px 8px;
            border-radius: 5px;
            font-size: 10px;
            font-weight: 700;
            color: #10b981;
            border: 1px dashed #86efac;
        }
        .order-info {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 10px;
            font-size: 12px;
        }
        .info-row {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .info-label { font-size: 10px; color: var(--muted); font-weight: 700; text-transform: uppercase; }
        .info-value { font-size: 12px; font-weight: 700; color: var(--dark); }
        .order-items {
            background: #f9f9f9;
            padding: 10px;
            border-radius: 6px;
            margin: 8px 0;
            font-size: 11px;
        }
        .status-update {
            display: flex;
            gap: 8px;
            align-items: center;
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid var(--border);
        }
        .status-select {
            padding: 7px 10px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 11px;
            font-weight: 700;
        }
        .btn-update-status {
            padding: 7px 14px;
            background: var(--teal);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
        }
        .btn-update-status:hover { opacity: 0.9; }
        .empty-state { text-align: center; padding: 40px; color: var(--muted); }
        
        /* Image Preview Styles */
        .image-preview-item {
            position: relative;
            border-radius: 6px;
            overflow: hidden;
            border: 1px solid var(--border);
            background: #f9f9f9;
        }

        .image-preview-item img {
            width: 100%;
            height: 80px;
            object-fit: cover;
            display: block;
        }

        .image-preview-item .delete-btn {
            position: absolute;
            top: 2px;
            right: 2px;
            background: #dc2626;
            color: white;
            border: none;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.2s;
            padding: 0;
        }

        .image-preview-item:hover .delete-btn {
            opacity: 1;
        }

        .image-preview-item .delete-btn:hover {
            background: #991b1b;
        }
        
        @media (max-width: 480px) {
            .admin-sidebar { width: 160px; }
            .admin-main { margin-left: 160px; }
            .sidebar-toggle { left: 160px; }
            .sidebar-toggle.collapsed { left: 0; }
            .form-grid { grid-template-columns: 1fr; }
            .form-group.full-width { grid-column: 1; }
            .order-info { grid-template-columns: 1fr; }
            .admin-logo img { height: 60px; }
        }
        @media (max-width: 768px) {
            .admin-container { flex-direction: column; }
            .admin-sidebar { 
                width: 100%; 
                position: relative; 
                height: auto; 
                padding: 15px;
                box-shadow: 0 2px 8px rgba(0,0,0,0.1);
                transform: none !important;
            }
            .admin-sidebar.collapsed {
                transform: none !important;
                display: none;
            }
            .admin-main { 
                margin-left: 0 !important; 
                padding: 20px 15px;
            }
            .sidebar-toggle {
                position: relative;
                top: auto;
                left: auto !important;
                transform: none;
                width: 100%;
                height: 36px;
                border-radius: 8px;
                border: 1px solid rgba(255,255,255,0.12);
                margin-bottom: 10px;
            }
            .sidebar-toggle.collapsed {
                left: auto !important;
            }
            .admin-logo img { height: 50px; }
            .admin-header { 
                flex-direction: column; 
                align-items: flex-start; 
                gap: 15px;
            }
            .admin-header h1 { font-size: 22px; }
            .user-info { width: 100%; justify-content: space-between; }
            .section { padding: 20px 15px; }
            .section-header { flex-direction: column; align-items: flex-start; gap: 10px; }
            .section-header h2 { font-size: 16px; }
            .btn-primary { width: 100%; padding: 12px 20px; }
            .search-bar { flex-direction: column; }
            .search-input { width: 100%; }
            .btn-search, .btn-reset { width: 100%; margin-top: 8px; }
            .products-table { font-size: 11px; }
            .products-table th, .products-table td { padding: 8px 6px; }
            .product-thumbnail { width: 40px; height: 40px; }
            .btn-edit, .btn-delete { padding: 4px 8px; font-size: 10px; }
            .order-card { padding: 12px; }
            .order-header { flex-direction: column; align-items: flex-start; gap: 8px; }
            .status-update { flex-direction: column; align-items: stretch; }
            .status-select { width: 100%; }
            .btn-update-status { width: 100%; margin-top: 8px; }
            .orders-header { flex-direction: column; align-items: flex-start; gap: 10px; }
            .orders-actions { width: 100%; }
            .search-container { width: 100%; display: flex; flex-direction: column; gap: 8px; }
            .search-container .search-input { width: 100%; }
            .search-container .btn-search, 
            .search-container .btn-reset,
            .search-container .btn-refresh { width: 100%; }
        }
        @media (max-width: 480px) {
            .admin-sidebar { padding: 12px; }
            .admin-main { padding: 15px 10px; }
            .section { padding: 15px 12px; }
            .admin-header h1 { font-size: 18px; }
            .user-email { font-size: 11px; }
            .btn-logout { padding: 8px 16px; font-size: 11px; }
            .btn-primary { font-size: 11px; padding: 10px 16px; }
            .form-grid { gap: 10px; }
            label { font-size: 11px; }
            input, select, textarea { font-size: 11px; padding: 8px 10px; }
            .products-table th, .products-table td { padding: 6px 4px; font-size: 10px; }
            .product-thumbnail { width: 35px; height: 35px; }
            .order-info { font-size: 11px; }
            .info-label { font-size: 9px; }
            .info-value { font-size: 11px; }
            .order-items { font-size: 10px; padding: 8px; }
        }
    </style>
</head>
<body>
    <div class="admin-container">
        <!-- Sidebar Toggle -->
        <button class="sidebar-toggle" id="sidebarToggle" onclick="toggleSidebar()">
            <span class="arrow">&lsaquo;</span>
        </button>

        <!-- Sidebar -->
        <aside class="admin-sidebar" id="adminSidebar">
            <a href="index.html" class="admin-logo">
                <img src="design/logo.png" alt="ElectraCore logo">
            </a>
            <nav class="sidebar-nav">
                <div class="nav-item active" data-tab="products" onclick="switchTab('products', this)">📦 Products</div>
                <div class="nav-item" data-tab="orders" onclick="switchTab('orders', this)">📋 Orders</div>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="admin-main">
            <div class="admin-header">
                <h1>Admin Panel</h1>
                <div class="user-info">
                    <span class="user-email" id="userEmail">Loading...</span>
                    <button class="btn-logout" onclick="logout()">Logout</button>
                </div>
            </div>

            <!-- Products Tab -->
            <div id="products-tab" class="tab-content active">
                <div class="section">
                    <div class="section-header">
                        <h2>Products Management</h2>
                        <button class="btn-primary" onclick="toggleProductForm()">+ Add Product</button>
                    </div>

                    <!-- Product Form -->
                    <div id="productFormContainer" style="display: none; margin-bottom: 20px; padding: 15px; background: #f9f9f9; border-radius: 10px;">
                        <h3 style="margin: 0 0 12px 0; font-size: 13px; font-weight: 700;">Add / Edit Product</h3>
                        <form id="productForm" class="form-grid">
                            <input type="hidden" id="productId">
                            <div class="form-group">
                                <label>Product Name</label>
                                <input type="text" name="name" placeholder="e.g. iPhone 15" required>
                            </div>
                            <div class="form-group">
                                <label>Category</label>
                                <select name="category" required>
                                    <option value="">Select Category</option>
                                    <option value="phones">Phones</option>
                                    <option value="laptops">Laptops</option>
                                    <option value="headphones">Headphones</option>
                                    <option value="watches">Watches</option>
                                    <option value="accessories">Accessories</option>
                                    <option value="kitchen">Kitchen</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label>Price (EGP)</label>
                                <input type="number" name="price" placeholder="0" min="0" step="0.01" required>
                            </div>
                            <div class="form-group">
                                <label>Stock</label>
                                <input type="number" name="stock" placeholder="0" min="0" required>
                            </div>
                            <div class="form-group full-width">
                                <label>Description</label>
                                <textarea name="description" placeholder="Product details..." required></textarea>
                            </div>
                            <div class="form-group full-width">
                                <label>Product Images</label>
                                <p style="font-size: 11px; color: #666; margin: 5px 0;">Select one or multiple images (PNG, JPG, GIF)</p>
                                <input type="file" name="images" accept="image/*" multiple id="productImageInput">
                            </div>

                            <!-- Existing Images Preview -->
                            <div id="existingImagesContainer" style="display: none;" class="form-group full-width">
                                <label>Current Images</label>
                                <div id="existingImagesList" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(80px, 1fr)); gap: 10px; margin-top: 10px;">
                                </div>
                            </div>

                            <!-- New Images Preview -->
                            <div id="newImagesContainer" style="display: none;" class="form-group full-width">
                                <label>New Images Preview</label>
                                <div id="newImagesList" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(80px, 1fr)); gap: 10px; margin-top: 10px;">
                                </div>
                            </div>
                            <div class="btn-actions full-width">
                                <button type="submit" class="btn-primary">Save Product</button>
                                <button type="button" class="btn-secondary" onclick="toggleProductForm()">Cancel</button>
                            </div>
                        </form>
                    </div>

                    <!-- Products Search -->
                    <div class="search-bar">
                        <input type="text" id="productSearchInput" class="search-input" placeholder="Search products by name...">
                        <button class="btn-search" onclick="searchProducts()">Search</button>
                        <button class="btn-reset" onclick="resetProductSearch()">Reset</button>
                    </div>

                    <!-- Products Table -->
                    <div style="overflow-x: auto;">
                        <table class="products-table">
                            <thead>
                                <tr>
                                    <th>Product</th>
                                    <th>Category</th>
                                    <th>Price</th>
                                    <th>Stock</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody id="productsTableBody">
                                <tr><td colspan="5" style="text-align: center; padding: 20px; color: var(--muted);">Loading products...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <!-- Orders Tab -->
            <div id="orders-tab" class="tab-content">
                <div class="section">
                    <div class="orders-header">
                        <h2>Orders Management</h2>
                        <div class="orders-actions">
                            <div class="search-container">
                                <input type="text" id="searchInput" placeholder="Search orders..." class="search-input">
                                <button class="btn-search" onclick="performSearch()">Search</button>
                                <button class="btn-reset" onclick="resetSearch()">Reset</button>
                            </div>
                            <button class="btn-refresh" onclick="loadOrders()" style="background: #05a391; color: white; padding: 8px 16px; border: none; border-radius: 5px; cursor: pointer; margin-left: 10px;">🔄 Refresh Orders</button>
                        </div>
                    </div>

                    <!-- Orders Grid -->
                    <div class="orders-grid" id="ordersContainer">
                        <div class="empty-state">
                            <p>Loading orders...</p>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script type="module">
        import { 
            getFirestore, 
            collection, 
            query, 
            onSnapshot, 
            orderBy, 
            limit 
        } from 'https://www.gstatic.com/firebasejs/10.5.0/firebase-firestore.js';
        import app from './js/firebase-config.js';

        const db = getFirestore(app);

        let allProducts = [];
        let allOrders = [];
        let currentUser = null;
        let imagesToDelete = []; // Track images to delete
        let newImageFiles = []; // Track new image files

        // Initialize
        document.addEventListener('DOMContentLoaded', async () => {
            // Check session
            try {
                const sessionRes = await fetch('/api/session');
                const sessionData = await sessionRes.json();
                
                if (!sessionData.ok || !sessionData.user) {
                    window.location.href = '/signin.html';
                    return;
                }
                
                currentUser = sessionData.user;
                document.getElementById('userEmail').textContent = currentUser.email || 'Admin';
                
                loadProducts();
                setupRealtimeOrders();
                // Fallback: Load orders via API if Firebase doesn't work
                setTimeout(() => {
                    if (allOrders.length === 0) {
                        console.log('Firebase realtime not working, using API fallback');
                        loadOrders();
                    }
                }, 3000);
            } catch (error) {
                console.error('Session check error:', error);
                window.location.href = '/signin.html';
            }
        });

        // Setup Realtime Orders
        function setupRealtimeOrders() {
            const ordersRef = collection(db, 'orders');
            // Use API fallback first, then try Firebase
            console.log('🔄 Loading orders via API first...');
            loadOrders(); // Load via API immediately
            
            // Then try Firebase for real-time updates
            try {
                const q = query(ordersRef, orderBy('createdAt', 'desc'), limit(100));
                
                onSnapshot(q, (snapshot) => {
                    console.log('📡 Firebase snapshot received:', snapshot.size, 'orders');
                    allOrders = [];
                    snapshot.forEach(doc => {
                        allOrders.push({ id: doc.id, ...doc.data() });
                    });
                    renderOrders(allOrders);
                    
                    // Play sound for new orders
                    snapshot.docChanges().forEach(change => {
                        if (change.type === 'added') {
                            const orderData = change.doc.data();
                            const orderTime = orderData.createdAt?.toDate?.() || orderData.order_date?.toDate?.() || new Date();
                            const now = new Date();
                            if (now - orderTime < 30000) { // New order in last 30s
                                playNotificationSound();
                            }
                        }
                    });
                }, (error) => {
                    console.error('❌ Firebase listener error:', error);
                    console.log('🔄 Falling back to API only...');
                });
            } catch (error) {
                console.error('❌ Firebase setup error:', error);
            }
        }

        function playNotificationSound() {
            const audio = new Audio('https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3');
            audio.play().catch(e => console.log('Audio play failed:', e));
        }

        // Load Products
        async function loadProducts() {
            try {
                const res = await fetch('/api/products');
                if (!res.ok) throw new Error('Failed to load products');
                
                const data = await res.json();
                allProducts = data.products || data || [];
                renderProducts();
            } catch (error) {
                console.error('Error loading products:', error);
                document.getElementById('productsTableBody').innerHTML = '<tr><td colspan="5" style="text-align: center; color: #dc2626; padding: 20px;">Error loading products</td></tr>';
            }
        }

        function renderProducts(products = allProducts) {
            const tbody = document.getElementById('productsTableBody');
            if (products.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" style="text-align: center; padding: 20px; color: var(--muted);">No products found</td></tr>';
                return;
            }
            tbody.innerHTML = products.map(product => {
                const imageUrl = (product.images && product.images[0]) || product.image || 'design/placeholder.png';
                return `
                <tr>
                    <td>
                        <div class="product-name-cell">
                            <img src="${imageUrl}" alt="${product.name}" class="product-thumbnail" onerror="this.src='design/placeholder.png'">
                            <strong>${product.name || product.title || 'N/A'}</strong>
                        </div>
                    </td>
                    <td>${product.category || 'N/A'}</td>
                    <td>${(product.price || 0).toLocaleString('en-US')} EGP</td>
                    <td>${product.stock || 0}</td>
                    <td>
                        <button class="btn-edit" onclick="editProduct('${product.id}')">Edit</button>
                        <button class="btn-delete" onclick="deleteProduct('${product.id}')">Delete</button>
                    </td>
                </tr>
            `;
            }).join('');
        }

        // Load Orders
        async function loadOrders() {
            try {
                console.log('🔄 Loading orders via API...');
                const res = await fetch('/api/admin/orders-v2', { credentials: 'include' });
                if (!res.ok) throw new Error('Failed to load orders');
                
                const data = await res.json();
                console.log('📊 Orders loaded:', data);
                allOrders = data.orders || data || [];
                console.log('📋 Orders array:', allOrders);
                renderOrders(allOrders);
                
                // Also try the debug endpoint for more info
                try {
                    const debugRes = await fetch('/api/debug/orders', { credentials: 'include' });
                    if (debugRes.ok) {
                        const debugData = await debugRes.json();
                        console.log('🔍 Debug info:', debugData);
                    }
                } catch (debugError) {
                    console.log('Debug endpoint failed:', debugError);
                }
            } catch (error) {
                console.error('Error loading orders:', error);
                document.getElementById('ordersContainer').innerHTML = '<div class="empty-state" style="grid-column: 1/-1;"><p>Error loading orders: ' + error.message + '</p></div>';
            }
        }

        function renderOrders(orders) {
            const container = document.getElementById('ordersContainer');
            if (orders.length === 0) {
                container.innerHTML = '<div class="empty-state" style="grid-column: 1/-1;"><p>No orders found</p></div>';
                return;
            }

            container.innerHTML = orders.map(order => {
                const shipping = order.shipping || {};
                const items = order.items || [];
                const status = order.order_status || 'pending';
                const orderCode = order.order_code || 'N/A';
                const orderId = (order.id || order._id || '').substring(0, 8).toUpperCase();
                const summary = order.summary || {};

                return `
                    <div class="order-card">
                        <div class="order-header">
                            <div>
                                <div class="order-id">Order #${orderId}</div>
                                <div class="order-code">Code: ${orderCode}</div>
                            </div>
                        </div>

                        <div class="order-info">
                            <div class="info-row">
                                <span class="info-label">Customer</span>
                                <span class="info-value">${shipping.first_name || ''} ${shipping.last_name || ''}</span>
                            </div>
                            <div class="info-row">
                                <span class="info-label">Phone</span>
                                <span class="info-value">${shipping.phone || 'N/A'}</span>
                            </div>
                            <div class="info-row">
                                <span class="info-label">Email</span>
                                <span class="info-value" style="font-size: 11px;">${shipping.email || 'N/A'}</span>
                            </div>
                            <div class="info-row">
                                <span class="info-label">City</span>
                                <span class="info-value">${shipping.city || 'N/A'}</span>
                            </div>
                        </div>

                        <div class="order-items">
                            <strong style="font-size: 11px;">Items (${items.length}):</strong>
                            ${items.map(item => `<div style="margin-top: 2px;">• ${item.quantity}x ${item.name || item.title}</div>`).join('')}
                        </div>

                        <div style="font-size: 13px; font-weight: 900; color: var(--teal); text-align: right; padding: 8px 0;">
                            Total: ${(summary.total_amount || 0).toLocaleString('en-US')} EGP
                        </div>

                        <div class="status-update">
                            <select class="status-select" id="status-${order.id}">
                                <option value="pending" ${status === 'pending' ? 'selected' : ''}>Pending</option>
                                <option value="processing" ${status === 'processing' ? 'selected' : ''}>Processing</option>
                                <option value="shipped" ${status === 'shipped' ? 'selected' : ''}>Shipped</option>
                                <option value="delivered" ${status === 'delivered' ? 'selected' : ''}>Delivered</option>
                                <option value="cancelled" ${status === 'cancelled' ? 'selected' : ''}>Cancelled</option>
                            </select>
                            <button class="btn-update-status" onclick="updateOrderStatus('${order.id}')">Update</button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // Global Functions
        window.switchTab = function(tabName, element) {
            document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));
            document.getElementById(tabName + '-tab').classList.add('active');
            element.classList.add('active');
        };

        window.toggleProductForm = function() {
            const container = document.getElementById('productFormContainer');
            const isHidden = container.style.display === 'none';
            container.style.display = isHidden ? 'block' : 'none';
            if (isHidden) {
                document.getElementById('productForm').reset();
                document.getElementById('productId').value = '';
                imagesToDelete = [];
                newImageFiles = [];
                document.getElementById('existingImagesContainer').style.display = 'none';
                document.getElementById('newImagesContainer').style.display = 'none';
            }
        };

        window.deleteExistingImage = function(index, imageUrl) {
            if (confirm('Delete this image?')) {
                imagesToDelete.push(imageUrl);
                document.querySelector(`[data-image-index="${index}"]`).remove();
                
                const remaining = document.querySelectorAll('[data-image-index]').length;
                if (remaining === 0) {
                    document.getElementById('existingImagesContainer').style.display = 'none';
                }
            }
        };

        // Handle new image file selection
        document.getElementById('productImageInput').addEventListener('change', function(e) {
            newImageFiles = Array.from(this.files);
            const container = document.getElementById('newImagesContainer');
            const list = document.getElementById('newImagesList');
            
            if (newImageFiles.length > 0) {
                list.innerHTML = newImageFiles.map((file, index) => {
                    const reader = new FileReader();
                    const preview = document.createElement('div');
                    preview.className = 'image-preview-item';
                    preview.innerHTML = '<img src="" alt="Preview"><button type="button" class="delete-btn" onclick="removeNewImage(' + index + ')">✕</button>';
                    
                    reader.onload = function(e) {
                        preview.querySelector('img').src = e.target.result;
                    };
                    reader.readAsDataURL(file);
                    
                    return preview.outerHTML;
                }).join('');
                
                container.style.display = 'block';
            } else {
                container.style.display = 'none';
                list.innerHTML = '';
            }
        });

        window.removeNewImage = function(index) {
            const dataTransfer = new DataTransfer();
            newImageFiles.forEach((file, i) => {
                if (i !== index) {
                    dataTransfer.items.add(file);
                }
            });
            document.getElementById('productImageInput').files = dataTransfer.files;
            
            // Trigger change event
            const event = new Event('change', { bubbles: true });
            document.getElementById('productImageInput').dispatchEvent(event);
        };

        window.editProduct = function(productId) {
            const product = allProducts.find(p => p.id === productId);
            if (!product) {
                alert('Product not found');
                return;
            }
            
            document.getElementById('productId').value = productId;
            document.querySelector('[name="name"]').value = product.name || product.title || '';
            document.querySelector('[name="category"]').value = product.category || '';
            document.querySelector('[name="price"]').value = product.price || '';
            document.querySelector('[name="stock"]').value = product.stock || '';
            document.querySelector('[name="description"]').value = product.description || '';
            
            // Reset image tracking
            imagesToDelete = [];
            newImageFiles = [];
            document.getElementById('productImageInput').value = '';
            
            // Show existing images
            const existingImages = product.images || [];
            if (existingImages.length > 0) {
                const existingContainer = document.getElementById('existingImagesContainer');
                const existingList = document.getElementById('existingImagesList');
                existingList.innerHTML = existingImages.map((imgUrl, index) => `
                    <div class="image-preview-item" data-image-index="${index}" data-image-url="${imgUrl}">
                        <img src="${imgUrl}" alt="Product image" onerror="this.src='design/placeholder.png'">
                        <button type="button" class="delete-btn" onclick="deleteExistingImage(${index}, '${imgUrl}')">✕</button>
                    </div>
                `).join('');
                existingContainer.style.display = 'block';
            } else {
                document.getElementById('existingImagesContainer').style.display = 'none';
            }
            
            // Hide new images container initially
            document.getElementById('newImagesContainer').style.display = 'none';
            document.getElementById('newImagesList').innerHTML = '';
            
            document.getElementById('productFormContainer').style.display = 'block';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        };

        window.deleteProduct = function(productId) {
            if (confirm('Are you sure you want to delete this product?')) {
                fetch(`/api/products/${productId}`, { method: 'DELETE' })
                    .then(() => {
                        alert('Product deleted');
                        loadProducts();
                    })
                    .catch(error => alert('Error: ' + error.message));
            }
        };

        window.updateOrderStatus = function(orderId) {
            const select = document.getElementById(`status-${orderId}`);
            const newStatus = select.value;
            fetch(`/api/admin/orders/${orderId}/status`, {
                method: 'PATCH',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ status: newStatus })
            })
            .then(res => res.json())
            .then(data => {
                if (data.ok) {
                    // Toast or visual feedback
                    select.style.borderColor = 'var(--teal)';
                    setTimeout(() => select.style.borderColor = 'var(--border)', 2000);
                }
            })
            .catch(error => alert('Error updating status: ' + error.message));
        };

        window.performSearch = function() {
            const searchValue = document.getElementById('searchInput').value.trim().toLowerCase();
            if (!searchValue) {
                renderOrders(allOrders);
                return;
            }

            const filtered = allOrders.filter(order => {
                const orderId = (order.id || '').substring(0, 8).toUpperCase();
                const phone = order.shippingInfo?.phone || '';
                const orderCode = (order.order_code || order.orderCode || '').toString();
                
                return orderId.includes(searchValue.toUpperCase()) ||
                       phone.includes(searchValue) ||
                       orderCode.includes(searchValue.toUpperCase());
            });

            renderOrders(filtered);
        };

        window.resetSearch = function() {
            document.getElementById('searchInput').value = '';
            renderOrders(allOrders);
        };

        window.searchProducts = function() {
            const searchValue = document.getElementById('productSearchInput').value.trim().toLowerCase();
            if (!searchValue) {
                renderProducts(allProducts);
                return;
            }
            const filtered = allProducts.filter(product => {
                const name = (product.name || product.title || '').toLowerCase();
                return name.includes(searchValue);
            });
            renderProducts(filtered);
        };

        window.resetProductSearch = function() {
            document.getElementById('productSearchInput').value = '';
            renderProducts(allProducts);
        };

        window.logout = function() {
            window.location.href = '/signin.html';
        };

        // Product Form Submission
        document.getElementById('productForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const productId = document.getElementById('productId').value;
            const formData = new FormData();
            formData.append('name', document.querySelector('[name="name"]').value.trim());
            formData.append('category', document.querySelector('[name="category"]').value);
            formData.append('price', parseFloat(document.querySelector('[name="price"]').value));
            formData.append('stock', parseInt(document.querySelector('[name="stock"]').value));
            formData.append('description', document.querySelector('[name="description"]').value.trim());
            
            // Add new images
            newImageFiles.forEach(file => {
                formData.append('images', file);
            });
            
            // Add images to delete (only for edit)
            if (productId && imagesToDelete.length > 0) {
                formData.append('imagesToDelete', JSON.stringify(imagesToDelete));
            }

            try {
                const url = productId ? `/api/products/${productId}` : '/api/products';
                const method = productId ? 'PUT' : 'POST';
                
                const res = await fetch(url, {
                    method: method,
                    body: formData
                });

                if (res.ok) {
                    alert(productId ? 'Product updated' : 'Product added');
                    document.getElementById('productFormContainer').style.display = 'none';
                    document.getElementById('productForm').reset();
                    imagesToDelete = [];
                    newImageFiles = [];
                    loadProducts();
                } else {
                    const error = await res.text();
                    alert('Error saving product: ' + error);
                }
            } catch (error) {
                alert('Error: ' + error.message);
            }
        });

        // Search on Enter
        document.getElementById('searchInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                performSearch();
            }
        });

        // Product Search on Enter
        document.getElementById('productSearchInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                searchProducts();
            }
        });

        // Sidebar Toggle
        window.toggleSidebar = function() {
            const sidebar = document.getElementById('adminSidebar');
            const toggle = document.getElementById('sidebarToggle');
            const main = document.querySelector('.admin-main');
            sidebar.classList.toggle('collapsed');
            toggle.classList.toggle('collapsed');
            main.classList.toggle('sidebar-hidden');
        };
    </script>
</body>
</html>
